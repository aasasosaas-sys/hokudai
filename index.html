03c/i>\u003c/div>`;\n  const s=S.streak[i]||0;\n  app.innerHTML=`${head}\u003cdiv class=\"q\">\u003cspan class=\"pos ${pcls(w[1])}\">${w[1]}\u003c/span>\u003cdiv class=\"w\">${esc(w[0])}\u003c/div>\u003cbutton class=\"spk\" onclick=\"speak('${w[0].replace(/'/g,'')}')\">🔊 発音\u003c/button>${ex?'':`\u003cdiv class=\"dots\" id=\"dots\">${[0,1,2].map(k=>`\u003cu class=\"${k\u003cs?'on':''}\">\u003c/u>`).join('')}\u003c/div>`}\u003c/div>\n  \u003cdiv class=\"ch\">${Q.ch.map((j,k)=>`\u003cbutton class=\"${pcls(W[j][1])}\" onclick=\"ans(${k})\">\u003cem>${k+1}\u003c/em>\u003cspan>${esc(W[j][2])}\u003c/span>\u003c/button>`).join('')}\u003c/div>\u003cdiv id=\"fb\">\u003c/div>`;\n}\nfunction ans(k){\n  if(!Q||Q.answered)return;Q.answered=true;\n  const ok=Q.ch[k]===Q.cur,btns=app.querySelectorAll('.ch button');\n  btns.forEach((b,x)=>{b.disabled=true;if(Q.ch[x]===Q.cur)b.classList.add('ok');else if(x===k)b.classList.add('ng')});\n  const fb=document.getElementById('fb');\n  if(Q.mode==='learn'){\n    const i=Q.cur;let mastered=false;const r0=rate(Q.st),c0=cov();\n    if(ok){S.streak[i]=(S.streak[i]||0)+1;if(S.streak[i]>=NEED){S.mast[i]=1;mastered=true}}else S.streak[i]=0;\n    save();\n    const s=S.streak[i];document.getElementById('rt').textContent='修得率 '+rate(Q.st).toFixed(1)+'%';document.getElementById('rb').style.width=rate(Q.st)+'%';document.getElementById('dots').innerHTML=[0,1,2].map(x=>`\u003cu class=\"${x\u003cs?'on':''}\">\u003c/u>`).join('');\n    if(ok){const up=`\u003cbr>修得ポイント +1　修得率 \u003cb>${r0.toFixed(1)}% → ${rate(Q.st).toFixed(1)}%\u003c/b>${Math.abs(cov()-c0)>1e-9?`\u003cbr>北大単語カバー率 \u003cb>${c0.toFixed(2)}% → ${cov().toFixed(2)}%\u003c/b>`:''}`;fb.innerHTML=(mastered?'\u003cspan class=\"good\">⭕ 正解！ 🎉 修得！\u003c/span>':`\u003cspan class=\"good\">⭕ 正解（${s}/${NEED}連続）\u003c/span>`)+up;setTimeout(()=>{if(Q&&Q.mode==='learn')nextLearn()},mastered?1400:1100)}\n    else fb.innerHTML=`\u003cspan class=\"bad\">❌ 不正解　連続回数が0に戻りました（修得率 ${r0.toFixed(1)}% → ${rate(Q.st).toFixed(1)}%）\u003c/span>${Math.abs(cov()-c0)>1e-9?`\u003cbr>\u003cspan class=\"bad\">北大単語カバー率 ${c0.toFixed(2)}% → ${cov().toFixed(2)}%（2ポイント未満に戻ったため）\u003c/span>`:''}\u003cbr>${esc(W[Q.cur][0])}（${W[Q.cur][1]}）＝ \u003cb>${esc(W[Q.cur][2])}\u003c/b>\u003cbutton class=\"btn\" onclick=\"nextLearn()\">次へ（Enter）\u003c/button>`;\n  }else{\n    if(ok){Q.ok++;if(Q.ok>=EXQ)return finishExam(true)}else fb.innerHTML=`\u003cspan class=\"bad\">❌ 正解：${esc(W[Q.cur][2])}\u003c/span>`;\n    setTimeout(()=>{if(Q&&Q.mode==='exam')examNext()},ok?300:900);\n  }\n}\nfunction skipExam(st){\n  S.clear[st]=1;save();\n  if(st+1\u003cNST)stage(st+1,'Stage '+(st+1)+' クリア！新しい100語が解放されました。');\n  else stage(st,'🎉 全ステージ制覇！');\n}\nfunction startExam(st){\n  const[a,b]=range(st);let list=[];\n  while(list.length\u003c300){const idx=[];for(let i=a;i\u003cb;i++)idx.push(i);list=list.concat(shuffle(idx))}\n  Q={mode:'exam',st,list,idx:0,ok:0,t0:Date.now(),done:false};\n  clearInterval(T);T=setInterval(tick,100);setExamQ();\n}\nfunction setExamQ(){Q.cur=Q.list[Q.idx];Q.ch=choices(Q.cur);Q.answered=false;qview()}\nfunction tick(){\n  if(!Q||Q.mode!=='exam'){clearInterval(T);return}\n  const left=Math.max(0,EXT-(Date.now()-Q.t0)/1000),tm=document.getElementById('tm'),tb=document.getElementById('tb');\n  if(tm){tm.textContent=left.toFixed(1);tm.classList.toggle('low',left\u003c=20)}\n  if(tb)tb.style.width=(left/EXT*100)+'%';\n  if(left\u003c=0)finishExam(false);\n}\nfunction examNext(){Q.idx++;if(Q.idx>=Q.list.length){const idx=[];for(let i=range(Q.st)[0];i\u003crange(Q.st)[1];i++)idx.push(i);Q.list=Q.list.concat(shuffle(idx))}setExamQ()}\nfunction quitExam(){clearInterval(T);stage(Q.st)}\nfunction finishExam(done){\n  clearInterval(T);if(Q.done)return;Q.done=true;\n  const st=Q.st,ok=Q.ok,answered=done?Q.idx+1:Q.idx+(Q.answered?1:0),used=Math.min(EXT,(Date.now()-Q.t0)/1000).toFixed(1);\n  if(done){S.clear[st]=1;save()}\n  const nxt=st+1\u003cNST;\n  app.innerHTML=`\u003cdiv class=\"big\">${done?'🎓':'⏰'}\u003c/div>\u003ch2 class=\"c\">${done?'昇格試験クリア！':'時間切れ…'}\u003c/h2>\n  ${done?`\u003cp class=\"c sub\">北大単語カバー率 \u003cb>${cov().toFixed(1)}%\u003c/b>（このステージ100語を100%として計上）\u003c/p>`:''}\n  \u003cp class=\"c sub\">${done?`${used}秒で${EXQ}問正解（出題 ${answered}問）`:`正解 ${ok} / ${EXQ}問（出題 ${answered}問）`}\u003c/p>\n  ${done&&nxt?`\u003cbutton class=\"btn\" onclick=\"stage(${st+1},'Stage ${st+1} クリア！新しい100語が解放されました。')\">次のステージへ（Stage ${st+2}）\u003c/button>`:''}\n  ${done&&!nxt?'\u003cp class=\"c good\">全ステージ制覇！おめでとう 🎉\u003c/p>':''}\n  ${done?'':`\u003cbutton class=\"btn\" onclick=\"startExam(${st})\">もう一度挑戦\u003c/button>`}\n  \u003cbutton class=\"btn alt\" onclick=\"home()\">ステージ一覧へ\u003c/button>`;\n  Q=null;\n}\n/* ===== 予想点数テスト v2（100秒・1.2秒/問で満点） ===== */\nconst PT_SEC=100,TARGET=1.3,PT_MAX=PT_SEC/TARGET,POOL_K=5,POOL_D=0.8;\nconst Q_LIST=0.92,EXCL=0.20,RARE=0.6,FLOOR=0.05,GDIV=5,CAP_MS=8000,SHR=2;\nconst ANCH=[[0.55,0],[0.66,0.12],[0.74,0.26],[0.81,0.44],[0.89,0.64],[0.93,0.78],[0.974,1]];\nconst Rfn=c=>{if(c\u003c=ANCH[0][0])return 0;for(let k=1;k\u003cANCH.length;k++){const[x0,y0]=ANCH[k-1],[x1,y1]=ANCH[k];if(c\u003c=x1)return y0+(y1-y0)*(c-x0)/(x1-x0)}return 1};\nconst clamp=(v,a,b)=>Math.max(a,Math.min(b,v));\nconst LV=[[.85,'S','余裕をもって読み切れる語彙力と処理速度'],[.70,'A','長文を速く正確に読める水準'],[.55,'B','標準的に読めるが、速さか取りこぼしに伸びしろ'],[.40,'C','語彙の取りこぼしや反応の遅れが目立つ'],[.25,'D','頻出語の定着から固めたい段階'],[0,'E','まず超頻出語を反射的に理解できる状態に']];\nconst lvOf=f=>LV.find(l=>f>=l[0]);\nconst predMax=()=>150;\nconst ordF=W.map((_,i)=>i).sort((a,b)=>W[b][3]-W[a][3]||W[a][0].length-W[b][0].length||a-b);\nconst BTH=[.5,.7,.8,.88,.93,.96,.98,1.01],BNAME=['超頻出','頻出','標準','やや難','難','高難度','最難関','低頻度'],NBd=BTH.length;\nconst bandOf=new Array(W.length),bandN=BTH.map(()=>0),bandM=BTH.map(()=>0),bandW=BTH.map(()=>[]);\n(()=>{let cum=0;ordF.forEach(i=>{const b=BTH.findIndex(t=>cum/TOT\u003ct);bandOf[i]=b;bandN[b]++;bandM[b]+=W[i][3];bandW[b].push(i);cum+=W[i][3]})})();\nconst bandStart=bandN.map((_,k)=>bandN.slice(0,k).reduce((a,b)=>a+b,0));\nconst MASS=bandM.map(m=>m/TOT);\nconst AWr=MASS.map(Math.sqrt),AWs=AWr.reduce((a,b)=>a+b,0),AW=AWr.map(x=>x/AWs);\nconst fmtD=t=>{const d=new Date(t),p=n=>String(n).padStart(2,'0');return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`};\nconst pct=(v,d=0)=>(v*100).toFixed(d)+'%';\nfunction rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}\n\n/* --- 推定エンジン --- */\nconst emptyB=()=>BTH.map(()=>({n:0,ok:0,wr:0,dk:0,ms:0}));\nconst addB=(b,r)=>{const w=r[4]||1;b.n+=w;b.ms+=Math.min(r[2],CAP_MS)*w;if(r[1]===1)b.ok+=w;else if(r[1]===0)b.wr+=w;else b.dk+=w};\nfunction smoothB(B){\n  const raw=B.map(b=>b.n?clamp((b.ok-b.wr/GDIV)/b.n,0,1):null);\n  const bl=[];B.forEach((b,k)=>{if(b.n)bl.push({v:raw[k],w:MASS[k],ks:[k]})});\n  for(let p=0;p\u003cbl.length-1;){if(bl[p].v\u003cbl[p+1].v-1e-12){const x=bl[p],y=bl[p+1],w=x.w+y.w;bl.splice(p,2,{v:(x.v*x.w+y.v*y.w)/w,w,ks:x.ks.concat(y.ks)});if(p>0)p--}else p++}\n  const sm=Array(NBd).fill(null);bl.forEach(g=>g.ks.forEach(k=>sm[k]=g.v));\n  const last=Math.max(...B.map((b,k)=>b.n?k:-1));\n  for(let k=0;k\u003cNBd;k++)if(sm[k]===null){\n    let l=k-1;while(l>=0&&sm[l]===null)l--;let r=k+1;while(r\u003cNBd&&sm[r]===null)r++;\n    sm[k]=last\u003c0?0:(k>last?sm[l]*0.85:(l>=0&&r\u003cNBd?(sm[l]+sm[r])/2:(l>=0?sm[l]:sm[r])));\n  }\n  return{raw,sm};\n}\nfunction rtB(B){\n  let n=0,ms=0;B.forEach(b=>{n+=b.n;ms+=b.ms});const all=n?ms/n:0;\n  const rt=B.map(b=>(b.ms+SHR*all)/(b.n+SHR));\n  return{rt,text:rt.reduce((s,v,k)=>s+v*MASS[k],0)/1000,all:all/1000};\n}\nfunction fromSm(sm,rtText,par){\n  const cList=sm.reduce((s,v,k)=>s+v*MASS[k],0);\n  const r=par.RARE*sm[NBd-1];\n  const Cc=par.Q*cList+(1-par.Q)*r,C=clamp(par.EX+(1-par.EX)*Cc+(par.sh||0),0,1);\n  const V=FLOOR+(1-FLOOR)*Rfn(C),F=rtText>0?Math.min(1,TARGET/rtText):0;\n  return{cList,r,C,V,F,frac:V*F,vocab:sm.reduce((s,v,k)=>s+v*bandN[k],0)};\n}\nconst NOM={Q:Q_LIST,EX:EXCL,RARE:RARE,sh:0};\nfunction coreB(B,par){const s=smoothB(B),t=rtB(B);return Object.assign({B,raw:s.raw,sm:s.sm,rt:t.rt,rtText:t.text,rtAll:t.all},fromSm(s.sm,t.text,par||NOM))}\nfunction bootB(resp,seed,nrep){\n  const rnd=rng(seed),by=BTH.map(()=>[]);resp.forEach(r=>by[bandOf[r[0]]].push(r));\n  const g=()=>{let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};\n  const F=[],C=[],Vo=[];\n  for(let k=0;k\u003cnrep;k++){\n    const B=emptyB();by.forEach((a,b)=>{for(let j=0;j\u003ca.length;j++)addB(B[b],a[Math.floor(rnd()*a.length)])});\n    const par={Q:clamp(Q_LIST+0.02*g(),.85,.98),EX:clamp(EXCL+0.02*g(),.1,.3),RARE:.4+.4*rnd(),sh:0.01*g()};\n    const c=coreB(B,par);F.push(c.frac);C.push(c.C);Vo.push(c.vocab);\n  }\n  const q=(a,p)=>{a.sort((x,y)=>x-y);return a[clamp(Math.round(p*(a.length-1)),0,a.length-1)]};\n  return{fLo:q(F,.05),fHi:q(F,.95),cLo:q(C,.05),cHi:q(C,.95),vLo:q(Vo,.05),vHi:q(Vo,.95)};\n}\nfunction inflate(bt,frac){const KR=1.2,fl=Math.min(bt.fLo,frac),fh=Math.max(bt.fHi,frac);bt.fLo=clamp(frac-(frac-fl)*KR,0,1);bt.fHi=clamp(frac+(fh-frac)*KR,0,1);return bt}\nfunction analyzePT(resp,seed){\n  const n=resp.length;let ok=0,wr=0,dk=0,ms=0;\n  resp.forEach(r=>{if(r[1]===1)ok++;else if(r[1]===0)wr++;else dk++;ms+=r[2]});\n  const B=emptyB();resp.forEach(r=>addB(B[bandOf[r[0]]],r));\n  const c=coreB(B);\n  const bt=bootB(resp,seed||12345,300);\n  const mx=predMax(),adj=Math.max(0,ok-wr/GDIV);inflate(bt,c.frac);\n  const sorted=resp.map(r=>r[2]).sort((a,b)=>a-b),med=sorted[Math.floor(n/2)];\n  const h1=resp.filter(r=>r[3]\u003c=PT_SEC*500),h2=resp.filter(r=>r[3]>PT_SEC*500);\n  const av=x=>x.length?x.reduce((s,r)=>s+Math.min(r[2],CAP_MS),0)/x.length:0;\n  const gains=c.sm.map((v,b)=>{const sm2=c.sm.slice();sm2[b]=Math.max(sm2[b],0.97);return Math.round(mx*(fromSm(sm2,c.rtText,NOM).frac-c.frac))});\n  const tgC=0.95,Cc=(tgC-EXCL)/(1-EXCL),tgL=(Cc-(1-Q_LIST)*c.r)/Q_LIST;let need=0;\n  if(c.cList\u003ctgL){let gg=tgL-c.cList,u=0;for(const i of ordF){const q=1-c.sm[bandOf[i]],gi=q*W[i][3]/TOT;if(gi>=gg){u+=q*(gg/gi);gg=0;break}gg-=gi;u+=q}need=Math.round(u)}\n  const spread=(bt.fHi-bt.fLo)*mx;\n  const rel=n\u003c20?['low','参考値（回答数が少なめ）']:spread\u003c=0.18*mx?['high','信頼度：高め']:spread\u003c=0.32*mx?['mid','信頼度：中程度（もう1〜2回で安定）']:['low','ばらつき大（もう1〜2回受けてください）'];\n  const tap=med\u003c400&&(adj/Math.max(1,n))\u003c0.3;\n  return Object.assign({n,ok,wr,dk,adj,acc:ok/n,accAdj:adj/n,avgMs:ms/n,medMs:med,h1:av(h1),h2:av(h2),score:Math.round(mx*c.frac),lo:Math.round(mx*bt.fLo),hi:Math.round(mx*bt.fHi),bt,gains,need,rel,tap,speed:n/PT_MAX},c);\n}\nconst _pc=new Map();\nfunction analyzePool(idx,nrep){\n  const L=S.tests.slice(Math.max(0,idx-POOL_K+1),idx+1),mx=predMax();\n  const key=L.map(e=>e.t).join(',')+'|'+mx+'|'+nrep;if(_pc.has(key))return _pc.get(key);\n  const resp=[];L.forEach((e,j)=>{const w=Math.pow(POOL_D,L.length-1-j);e.resp.forEach(r=>resp.push([r[0],r[1],r[2],r[3],w]))});\n  const B=emptyB();resp.forEach(r=>addB(B[bandOf[r[0]]],r));const c=coreB(B);\n  let bt={fLo:c.frac,fHi:c.frac};if(nrep){bt=bootB(resp,L[L.length-1].t+7,nrep);inflate(bt,c.frac)}\n  const scores=L.map(e=>Math.round(e.s.frac*mx)),m=scores.reduce((a,b)=>a+b,0)/scores.length,sd=Math.sqrt(scores.reduce((a,b)=>a+(b-m)**2,0)/Math.max(1,scores.length-1));\n  const spread=(bt.fHi-bt.fLo)*mx,nn=resp.length;\n  const rel=!nrep?['mid','']:nn\u003c20?['low','参考値（回答数が少なめ）']:spread\u003c=0.14*mx?['high','信頼度：高め']:spread\u003c=0.26*mx?['mid','信頼度：中程度']:['low','ばらつき大'];\n  const o={frac:c.frac,score:Math.round(mx*c.frac),lo:Math.round(mx*bt.fLo),hi:Math.round(mx*bt.fHi),scores,sd,tests:L,rel,c,n:nn};\n  _pc.set(key,o);if(_pc.size>60)_pc.delete(_pc.keys().next().value);return o;\n}\n/* --- 出題（帯ごとの層化抽出・出現数に比例） --- */\nfunction pickBand(me){\n  let best=[],bv=Infinity;\n  for(let b=0;b\u003cNBd;b++){if(me.nb[b]>=bandN[b]*0.8)continue;const v=(me.nb[b]+0.5)/AW[b];if(v\u003cbv-1e-9){bv=v;best=[b]}else if(Math.abs(v-bv)\u003c1e-9)best.push(b)}\n  return best.length?best[Math.floor(Math.random()*best.length)]:0;\n}\nfunction pickWord(me,b){\n  const c=[];let tot=0;bandW[b].forEach(i=>{if(!me.used.has(i)){c.push(i);tot+=W[i][3]}});\n  if(!c.length){bandW[b].forEach(i=>me.used.delete(i));return pickWord(me,b)}\n  let r=Math.random()*tot;for(const i of c){r-=W[i][3];if(r\u003c=0)return i}return c[c.length-1];\n}\nfunction pickNext(me){const b=pickBand(me),i=pickWord(me,b);me.nb[b]++;me.used.add(i);me.cur=i;me.ch=choices(i);me.qs=Date.now()}\n\n/* --- 画面 --- */\nfunction ptCard(){\n  const E=S.tests,L=E[E.length-1],mx=predMax(),best=E.reduce((m,e)=>Math.max(m,Math.round(e.s.frac*mx)),0);\n  let body;\n  if(!L)body=`\u003cp class=\"sub\">${TARGET}秒に1問のペースで全問正解すると満点。語彙力と読む速さの両方を測ります。\u003c/p>`;\n  else{const pl=analyzePool(E.length-1,150);\n    body=`\u003cdiv class=\"covn\">${pl.score}\u003csmall>点（直近${pl.tests.length}回の合算予想）\u003c/small>\u003c/div>\u003cdiv class=\"sub\">範囲 ${pl.lo}〜${pl.hi}点 ／ 前回 ${Math.round(L.s.frac*mx)}点 ／ 自己ベスト ${best}点 ／ 計${E.length}回\u003c/div>`}\n  return `\u003cdiv class=\"cov\">\u003cdiv class=\"sub\">⏱ 予想点数テスト（${PT_SEC}秒・${mx}点満点）\u003c/div>${body}\u003cbutton class=\"btn pred\" onclick=\"ptIntro()\">テストを受ける\u003c/button>${L?`\u003cbutton class=\"btn alt\" onclick=\"records()\">記録・グラフを見る\u003c/button>`:''}\u003c/div>`;\n}\nfunction ptIntro(){\n  Q=null;clearInterval(T);const mx=predMax();\n  app.innerHTML=`\u003cbutton class=\"ghost\" onclick=\"home()\">← 戻る\u003c/button>\u003ch2>予想点数テスト\u003c/h2>\n  \u003cdiv class=\"cov\">\u003cp style=\"margin:4px 0\">${PT_SEC}秒間、英単語→日本語の6択をできるだけ多く、正確に解きます。回答するとすぐ次の問題へ進みます（待ち時間なし）。\u003c/p>\n  \u003cp class=\"sub\" style=\"margin:6px 0\">出題は北大2010〜2026年度の過去問での出現数にもとづき、頻出順に8つの帯から層化して選びます（頻出語が多め、ときどき難語）。\u003c/p>\u003c/div>\n  \u003cdiv class=\"cov\">\u003cb>満点：150点（固定）\u003c/b>\u003cp class=\"sub\" style=\"margin:6px 0\">北大の英語は150点満点のため、予想点数は150点満点で固定しています。\u003c/p>\u003c/div>\n  \u003cdiv class=\"cov\">\u003cb>採点のしくみ（${mx}点満点）\u003c/b>\u003cp class=\"sub\" style=\"margin:6px 0\">北大は読む速度が重要なので、\u003cb>${TARGET}秒に1問のペースで${PT_SEC}秒間答え続けて全問正解＝満点\u003c/b>（約${Math.round(PT_MAX)}問）とします。\u003c/p>\n  \u003cp style=\"margin:6px 0;font-weight:700\">点数 ＝ 満点 × 語彙点 × 速度係数\u003c/p>\n  \u003cp class=\"sub\" style=\"margin:4px 0\">・語彙点：帯ごとの正答（不正解は −0.2 の補正）から、過去問の本文に出る語を何%理解できるか（語彙カバー率）を推定して換算\u003cbr>・速度係数：本文での出現数で重みづけした平均反応時間 が ${TARGET}秒以下なら×1.0、遅いほど ${TARGET}÷反応時間\u003cbr>・「わからない」は減点なし。当てずっぽうは補正され得になりません\u003cbr>・予想範囲は、回答のばらつきとモデルの前提の不確かさを含めたブートストラップ（300回）の90%範囲です\u003cbr>・結果は\u003cb>直近5回の合算\u003c/b>（新しい回ほど重く）でも推定します。回数を重ねるほど精度が上がります\u003c/p>\u003c/div>\n  ${ptSpkBar()}\u003cbutton class=\"btn\" onclick=\"ptStart()\">スタート（3秒前から）\u003c/button>\n  ${S.tests.length?`\u003cbutton class=\"btn alt\" onclick=\"records()\">過去の記録・グラフ\u003c/button>`:''}\n  \u003cp class=\"sub\">キー操作：1〜6で選択、0で「わからない」\u003c/p>`;\n}\nfunction ptStart(){\n  const me={mode:'pt',live:false,done:false};Q=me;clearInterval(T);\n  const cd=n=>{if(Q!==me)return;if(n===0)return ptBegin(me);app.innerHTML=`\u003cdiv class=\"big\" style=\"font-size:96px;margin-top:80px\">${n}\u003c/div>\u003cp class=\"c sub\">準備してください\u003c/p>`;setTimeout(()=>cd(n-1),1000)};\n  cd(3);\n}\nfunction ptBegin(me){\n  Object.assign(me,{nb:Array(NBd).fill(0),used:new Set(),resp:[],last:null,live:true,t0:Date.now()});\n  pickNext(me);ptView();clearInterval(T);T=setInterval(ptTick,100);\n}\nfunction ptView(){\n  const w=W[Q.cur],okn=Q.resp.filter(r=>r[1]===1).length,left=Math.max(0,PT_SEC-(Date.now()-Q.t0)/1000);\n  const lt=Q.last?`前：${Q.last.res===1?'\u003cspan class=\"good\">⭕\u003c/span>':Q.last.res===0?'\u003cspan class=\"bad\">❌\u003c/span>':'\u003cspan class=\"bad\">－\u003c/span>'} ${esc(W[Q.last.i][0])} ＝ ${esc(W[Q.last.i][2])}`:'&nbsp;';\n  app.innerHTML=`\u003cdiv class=\"top\">\u003cbutton class=\"ghost\" onclick=\"quitPT()\">× 中止\u003c/button>\u003cspan>回答 ${Q.resp.length} ／ ⭕ ${okn} ／ 目標${Math.round(PT_MAX)}問\u003c/span>\u003cspan class=\"tm ${left\u003c=20?'low':''}\" id=\"tm\">${left.toFixed(1)}\u003c/span>\u003c/div>\u003cdiv class=\"bar\">\u003ci id=\"tb\" style=\"width:${left/PT_SEC*100}%\">\u003c/i>\u003c/div>\n  \u003cdiv class=\"q\">\u003cspan class=\"pos ${pcls(w[1])}\">${w[1]}\u003c/span>\u003cdiv class=\"w\">${esc(w[0])}\u003c/div>\u003c/div>\n  \u003cdiv class=\"ch\">${Q.ch.map((j,k)=>`\u003cbutton class=\"${pcls(W[j][1])}\" onclick=\"ptAns(${k})\">\u003cem>${k+1}\u003c/em>\u003cspan>${esc(W[j][2])}\u003c/span>\u003c/button>`).join('')}\u003cbutton class=\"dk\" onclick=\"ptAns(-1)\">\u003cem>0\u003c/em>\u003cspan>わからない\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"sub\" style=\"margin-top:8px;min-height:20px\">${lt}\u003c/div>`;\n}\nfunction ptTick(){\n  if(!Q||Q.mode!=='pt'||!Q.live){clearInterval(T);return}\n  const left=Math.max(0,PT_SEC-(Date.now()-Q.t0)/1000),tm=document.getElementById('tm'),tb=document.getElementById('tb');\n  if(tm){tm.textContent=left.toFixed(1);tm.classList.toggle('low',left\u003c=20)}\n  if(tb)tb.style.width=(left/PT_SEC*100)+'%';\n  if(left\u003c=0)finishPT();\n}\nfunction ptAns(k){\n  if(!Q||Q.mode!=='pt'||!Q.live||Q.done)return;\n  const now=Date.now();if(now-Q.t0>=PT_SEC*1000)return finishPT();\n  const res=k\u003c0?2:(Q.ch[k]===Q.cur?1:0);\n  Q.resp.push([Q.cur,res,now-Q.qs,now-Q.t0]);Q.last={i:Q.cur,res};\n  pickNext(Q);ptView();\n}\nfunction quitPT(){clearInterval(T);Q=null;home()}\nfunction finishPT(){\n  if(!Q||Q.done)return;Q.done=true;clearInterval(T);\n  const resp=Q.resp;Q=null;\n  if(resp.length\u003c3){app.innerHTML=`\u003ch2 class=\"c\">回答が少なすぎるため記録しませんでした\u003c/h2>\u003cbutton class=\"btn\" onclick=\"ptIntro()\">もう一度\u003c/button>\u003cbutton class=\"btn alt\" onclick=\"home()\">ホームへ\u003c/button>`;return}\n  const t=Date.now(),a=analyzePT(resp,t),e={t,resp,s:{frac:a.frac,acc:a.acc,avg:a.avgMs/1000,rt:a.rtText,cT:a.C,vocab:a.vocab,n:a.n,V:a.V,F:a.F}};\n  S.tests.push(e);rvAdd(e);if(S.tests.length>300)S.tests.shift();save();\n  showPT(S.tests.length-1,true);\n}\nfunction adviceOf(a){\n  const L=[],avg=a.avgMs/1000,rt=a.rtText;\n  if(rt>TARGET*2)L.push(`本文の出現数で重みづけした平均反応時間は ${rt.toFixed(2)}秒/問で、満点ペース（${TARGET}秒）の約${(rt/TARGET).toFixed(1)}倍です。意味を「思い出す」段階から「見て分かる」段階へ。同じ語を短い間隔で繰り返し、反射的に分かる状態を目指しましょう。`);\n  else if(rt>TARGET*1.3)L.push(`反応時間は ${rt.toFixed(2)}秒/問。満点ペース（${TARGET}秒）まであと一歩です。迷う語を減らすことが最短の近道です。`);\n  else L.push(`反応時間は ${rt.toFixed(2)}秒/問で、満点ペース（${TARGET}秒）に近い速さです。`);\n  if(a.accAdj\u003c0.7&&avg\u003cTARGET*1.6)L.push(`速さに対して正確性が低めです（補正後 ${pct(a.accAdj)}）。分からない語は推測せず「わからない」を選ぶと減点を避けられます（不正解 ${a.wr}問）。`);\n  if(a.accAdj>=0.9&&rt>TARGET*1.5)L.push(`正確性は高い（補正後 ${pct(a.accAdj)}）のに反応に時間がかかっています。知識は十分なので、速さを上げるだけで点数が伸びます（速度係数 ×${a.F.toFixed(2)}）。`);\n  if(a.dk>a.n*0.25)L.push(`「わからない」が ${a.dk}問（${pct(a.dk/a.n)}）あります。未習得の頻出語が多い状態です。`);\n  if(a.h1&&a.h2&&a.h2>a.h1*1.25)L.push(`後半（${PT_SEC/2}秒以降）は前半より ${((a.h2/a.h1-1)*100).toFixed(0)}% 遅くなっています。集中の持続（長文を最後まで読む体力）が課題です。`);\n  const weak=a.sm.map((v,k)=>({k,v,m:MASS[k]})).filter(x=>x.v\u003c0.6&&x.m>=0.03).sort((x,y)=>y.m-x.m);\n  if(weak.length)L.push(`取りこぼしが大きい帯：${weak.slice(0,3).map(x=>`「${BNAME[x.k]}」（本文の${pct(x.m)}・推定正答 ${pct(x.v)}）`).join('、')}。ここを優先して覚えると本文カバー率が最も上がります。`);\n  const bi=a.gains.indexOf(Math.max(...a.gains));\n  if(a.gains[bi]>0)L.push(`伸びしろが最大なのは「${BNAME[bi]}」帯（${bandStart[bi]+1}〜${bandStart[bi]+bandN[bi]}語目）。ここを固めると予想点数が約 +${a.gains[bi]}点です。`);\n  const mx=predMax(),nx=LV.filter(l=>l[0]*mx>a.score).pop();\n  if(nx){const want=nx[0],Fn=want/a.V;\n    if(Fn\u003c=1)L.push(`次のランク ${nx[1]}（${Math.round(nx[0]*mx)}点）：今の語彙力のままなら、反応時間を ${(TARGET/Fn).toFixed(2)}秒/問まで縮めると届きます。`);\n    else L.push(`次のランク ${nx[1]}（${Math.round(nx[0]*mx)}点）：速度を満点ペースにしても今の語彙点（${pct(a.V)}）では届きません。語彙の底上げが必要です。`)}\n  if(a.tap)L.push('回答が極端に速く正答も低いため、適当に押している可能性があります。この結果は参考になりません。');\n  return L;\n}\nfunction timelineSVG(resp){\n  const Wd=600,Ht=190,Lm=34,Rm=10,Tp=10,Bt=26,pw=Wd-Lm-Rm,ph=Ht-Tp-Bt,X=t=>Lm+pw*t/PT_SEC,Y=v=>Tp+ph*(1-Math.min(v,PT_MAX+4)/(PT_MAX+4));\n  let s=`\u003csvg viewBox=\"0 0 ${Wd} ${Ht}\" style=\"width:100%;height:auto;display:block\">`;\n  [0,25,50,75,100].forEach(t=>s+=`\u003ctext x=\"${X(t)}\" y=\"${Ht-8}\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:var(--mut)\">${t}秒\u003c/text>`);\n  [0,20,40,60,80].forEach(v=>s+=`\u003cline x1=\"${Lm}\" x2=\"${Wd-Rm}\" y1=\"${Y(v)}\" y2=\"${Y(v)}\" style=\"stroke:var(--line)\"/>\u003ctext x=\"${Lm-5}\" y=\"${Y(v)+4}\" text-anchor=\"end\" font-size=\"11\" style=\"fill:var(--mut)\">${v}\u003c/text>`);\n  s+=`\u003cline x1=\"${X(0)}\" y1=\"${Y(0)}\" x2=\"${X(PT_SEC)}\" y2=\"${Y(PT_MAX)}\" style=\"stroke:var(--ac);opacity:.5;stroke-dasharray:5 4;stroke-width:2\"/>`;\n  let c=0,pts=`${X(0)},${Y(0)}`,dots='';\n  resp.forEach(([i,r,t,te])=>{c=Math.max(0,c+(r===1?1:r===0?-0.2:0));const x=X(te/1000);pts+=` ${x},${Y(c)}`;dots+=`\u003ccircle cx=\"${x}\" cy=\"${Y(c)}\" r=\"3\" style=\"fill:${r===1?'var(--ok)':r===0?'var(--ng)':'var(--mut)'}\"/>`});\n  s+=`\u003cpolyline points=\"${pts}\" style=\"fill:none;stroke:var(--ac);stroke-width:2\"/>${dots}\u003c/svg>`;\n  return s+`\u003cp class=\"sub\" style=\"margin:2px 0\">実線＝あなたの累積得点（正解+1／不正解−0.2）　点線＝満点ペース（${TARGET}秒/問）\u003c/p>`;\n}\nfunction showPT(idx,isNew){\n  const e=S.tests[idx],a=analyzePT(e.resp,e.t),mx=predMax(),lv=lvOf(a.frac),prev=idx>0?S.tests[idx-1]:null;\n  const sc=a.score,bestBefore=S.tests.slice(0,idx).reduce((m,x)=>Math.max(m,Math.round(x.s.frac*mx)),-1);\n  const d=prev?sc-Math.round(prev.s.frac*mx):null;\n  const meter=(p,l)=>`\u003cdiv class=\"sub\" style=\"margin:8px 0 0\">${l}\u003c/div>\u003cdiv class=\"bar\">\u003ci style=\"width:${Math.min(100,p*100)}%\">\u003c/i>\u003c/div>`;\n  const rowsB=a.B.map((b,k)=>`\u003ctr>\u003ctd>${BNAME[k]}\u003c/td>\u003ctd>${bandStart[k]+1}〜${bandStart[k]+bandN[k]}\u003c/td>\u003ctd>${pct(MASS[k],0)}\u003c/td>\u003ctd>${b.n?`${b.ok}/${b.n}`:'－'}\u003c/td>\u003ctd>${b.n?pct(a.raw[k]):'－'}\u003c/td>\u003ctd>\u003cb>${pct(a.sm[k])}\u003c/b>\u003c/td>\u003ctd>${(a.rt[k]/1000).toFixed(2)}秒\u003c/td>\u003ctd>${a.gains[k]>0?'+'+a.gains[k]+'点':'－'}\u003c/td>\u003c/tr>`).join('');\n  const miss=e.resp.filter(r=>r[1]!==1).sort((x,y)=>W[y[0]][3]-W[x[0]][3]).map(r=>`\u003ctr>\u003ctd>${r[1]===0?'❌':'－'}\u003c/td>\u003ctd>\u003cb>${esc(W[r[0]][0])}\u003c/b>\u003c/td>\u003ctd>${W[r[0]][1]}\u003c/td>\u003ctd>${esc(W[r[0]][2])}\u003c/td>\u003ctd>${BNAME[bandOf[r[0]]]}\u003c/td>\u003c/tr>`).join('');\n  const all=e.resp.map((r,k)=>`\u003ctr>\u003ctd>${k+1}\u003c/td>\u003ctd>${r[1]===1?'⭕':r[1]===0?'❌':'－'}\u003c/td>\u003ctd>\u003cb>${esc(W[r[0]][0])}\u003c/b>\u003c/td>\u003ctd>${(r[2]/1000).toFixed(2)}秒\u003c/td>\u003ctd>${(r[3]/1000).toFixed(1)}秒\u003c/td>\u003c/tr>`).join('');\n  const adv=adviceOf(a).map(x=>`\u003cli style=\"margin:6px 0\">${x}\u003c/li>`).join('');\n  const pl=analyzePool(idx,300),pk=pl.tests.length;\n  const poolHtml=`\u003cdiv class=\"cov\" style=\"border-left-color:var(--gold)\">\u003cdiv class=\"sub\">⭐ 直近${pk}回の合算予想${pk>=2?'（本命の推定値）':''}\u003c/div>\u003cdiv class=\"covn\">${pl.score}\u003csmall>点　範囲 ${pl.lo}〜${pl.hi} ／ ${mx}点満点\u003c/small>\u003c/div>\n  ${pk>=2?`\u003cp class=\"sub\" style=\"margin:2px 0\">各回：${pl.scores.map(x=>x+'点').join(' → ')}（ばらつき ±${pl.sd.toFixed(1)}点）。直近の回ほど重く（1回さかのぼるごとに×${POOL_D}）まとめて推定するので、1回だけより安定します。　${pl.rel[1]}\u003c/p>`:`\u003cp class=\"sub\" style=\"margin:2px 0\">1回の測定には約±${Math.round((pl.hi-pl.lo)/2)}点の誤差があります。あと1回受けると合算推定が出て、5回分まで合算するとさらに正確になります。\u003c/p>`}\u003c/div>`;\n  app.innerHTML=`\u003cbutton class=\"ghost\" onclick=\"${isNew?'home()':'records()'}\">← ${isNew?'ホーム':'記録一覧'}\u003c/button>\n  \u003cp class=\"sub\" style=\"margin:0\">${fmtD(e.t)} の結果\u003c/p>\n  \u003cdiv class=\"cov c\">\u003cdiv class=\"sub\">あなたの単語力から見た予想点数（${mx}点満点）\u003c/div>\u003cdiv class=\"covn\" style=\"font-size:64px\">${sc}\u003csmall>/ ${mx}\u003c/small>\u003c/div>\n  \u003cdiv class=\"sub\" style=\"margin:0\">予想範囲（90%）${a.lo}〜${a.hi}点 ・ 得点率 ${pct(a.frac)}\u003c/div>\n  \u003cdiv style=\"font-weight:800;font-size:18px;margin-top:6px\">ランク ${lv[1]}\u003c/div>\u003cdiv class=\"sub\">${lv[2]}\u003c/div>\n  \u003cdiv class=\"rel ${a.rel[0]}\">${a.rel[1]}\u003c/div>\n  \u003cp class=\"sub\" style=\"margin:6px 0\">${d===null?'初回の記録です':`前回比 \u003cb class=\"${d>=0?'good':'bad'}\">${d>=0?'+':''}${d}点\u003c/b>`}${sc>bestBefore&&bestBefore>=0?'　🏆 自己ベスト更新！':bestBefore>=0?`　自己ベスト ${Math.max(bestBefore,sc)}点`:''}\u003c/p>\u003c/div>\n  ${a.tap?'\u003cdiv class=\"cov\">\u003cb class=\"bad\">⚠ 適当に押している可能性があります\u003c/b>\u003cp class=\"sub\" style=\"margin:4px 0\">回答が極端に速く、正答も低いため、この結果は参考になりません。\u003c/p>\u003c/div>':''}\n  ${poolHtml}\n  \u003cdiv class=\"cov\">\u003cb>採点の内訳\u003c/b>\n  \u003ctable class=\"wl\">\u003ctr>\u003ctd>回答数\u003c/td>\u003ctd>\u003cb>${a.n}\u003c/b>問（満点ペースは約${Math.round(PT_MAX)}問）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>⭕ 正解\u003c/td>\u003ctd>${a.ok}問\u003c/td>\u003c/tr>\u003ctr>\u003ctd>❌ 不正解\u003c/td>\u003ctd>${a.wr}問（−${(a.wr/GDIV).toFixed(1)}）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>－ わからない\u003c/td>\u003ctd>${a.dk}問\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>補正後の正答率\u003c/td>\u003ctd>\u003cb>${pct(a.accAdj)}\u003c/b>（補正後の正解 ${a.adj.toFixed(1)}問）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>平均回答時間\u003c/td>\u003ctd>${(a.avgMs/1000).toFixed(2)}秒（中央値 ${(a.medMs/1000).toFixed(2)}秒）\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>本文換算の反応時間\u003c/td>\u003ctd>\u003cb>${a.rtText.toFixed(2)}秒/問\u003c/b>（出現数で重みづけ・満点ペース ${TARGET}秒）\u003c/td>\u003c/tr>\u003c/table>\n  ${meter(a.V,`語彙点　${pct(a.V)}（語彙カバー率 ${pct(a.C,1)} から換算）`)}${meter(a.F,`速度係数　×${a.F.toFixed(2)}（${TARGET} ÷ ${a.rtText.toFixed(2)}）`)}\n  \u003cp class=\"sub\" style=\"margin:6px 0\">点数 ＝ ${mx} × 語彙点 ${a.V.toFixed(2)} × 速度係数 ${a.F.toFixed(2)} ＝ ${(mx*a.frac).toFixed(1)}\u003c/p>\u003c/div>\n  \u003cdiv class=\"cov\">\u003cb>回答の推移\u003c/b>${timelineSVG(e.resp)}\u003c/div>\n  \u003cdiv class=\"cov\">\u003cb>語彙力の推定\u003c/b>\n  \u003ctable class=\"wl\">\u003ctr>\u003ctd>推定語彙（収録${W.length}語中）\u003c/td>\u003ctd>\u003cb>約${Math.round(a.vocab/10)*10}語\u003c/b>（90%範囲 ${Math.round(a.bt.vLo/10)*10}〜${Math.round(a.bt.vHi/10)*10}）\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>推定 本文カバー率\u003c/td>\u003ctd>\u003cb>${pct(a.C,1)}\u003c/b>（90%範囲 ${pct(a.bt.cLo,1)}〜${pct(a.bt.cHi,1)}）\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>カバー率95%まで\u003c/td>\u003ctd>${a.need?`あと約\u003cb>${a.need}\u003c/b>語`:'\u003cb>到達圏\u003c/b>'}\u003c/td>\u003c/tr>\u003c/table>\n  \u003cp class=\"sub\" style=\"margin:6px 0\">本文カバー率は、過去問の本文に出る語のうち意味が分かる語の割合の推定です。冠詞・代名詞・固有名詞などは既知、リスト外の語は最も難しい帯の${Math.round(RARE*100)}%の確率で既知と仮定しています。一般に95%前後が読解に必要な目安とされます。「あと約◯語」は、頻出の未習得語から順に覚えた場合の見積もりです。\u003c/p>\u003c/div>\n  \u003cdiv class=\"cov\">\u003cb>難易度帯ごとの分析\u003c/b>\u003cp class=\"sub\" style=\"margin:2px 0\">出現数順に8つの帯に分け、帯ごとの正答（当てずっぽう補正あり）を、難しい帯ほど下がるよう平滑化して推定しています。「平均秒」は少数回答を全体平均に寄せた値、「伸びしろ」はその帯を完璧にした場合の予想点数の増加です。\u003c/p>\n  \u003cdiv style=\"overflow-x:auto\">\u003ctable class=\"wl\">\u003ctr>\u003ctd>帯\u003c/td>\u003ctd>語数目\u003c/td>\u003ctd>本文\u003c/td>\u003ctd>正解\u003c/td>\u003ctd>実測\u003c/td>\u003ctd>推定\u003c/td>\u003ctd>平均秒\u003c/td>\u003ctd>伸びしろ\u003c/td>\u003c/tr>${rowsB}\u003c/table>\u003c/div>\u003c/div>\n  \u003cdiv class=\"cov\">\u003cb>分析とアドバイス\u003c/b>\u003cul style=\"padding-left:18px;margin:6px 0\">${adv}\u003c/ul>\u003c/div>\n  ${miss?`\u003cdetails open>\u003csummary>間違い・わからなかった語（${e.resp.filter(r=>r[1]!==1).length}語・頻出順）\u003c/summary>\u003ctable class=\"wl\">${miss}\u003c/table>\u003c/details>`:''}\n  \u003cdetails>\u003csummary>全${a.n}問の回答ログ\u003c/summary>\u003ctable class=\"wl\">\u003ctr>\u003ctd>#\u003c/td>\u003ctd>\u003c/td>\u003ctd>単語\u003c/td>\u003ctd>回答時間\u003c/td>\u003ctd>経過\u003c/td>\u003c/tr>${all}\u003c/table>\u003c/details>\n  \u003cdetails>\u003csummary>推定の仕組み・注意点\u003c/summary>\u003cdiv class=\"how\">\n  \u003cp>\u003cb>① 出題\u003c/b>：全${W.length}語を過去問での出現数順に並べ、本文の累積${BTH.slice(0,7).map(x=>Math.round(x*100)+'%').join('・')}で8つの帯に分けます。帯ごとの出題数は本文の出現割合の平方根に比例して配分し、帯の中では出現数が多い語ほど出やすくしています（層化抽出）。\u003c/p>\n  \u003cp>\u003cb>② 補正と平滑化\u003c/b>：当てずっぽうを補正（補正後の正解 ＝ 正解 − 不正解÷${GDIV}）。上の帯ほど知っているという単調性を満たすよう帯ごとの値をならし、未出題の帯は直前の帯から外挿します。\u003c/p>\n  \u003cp>\u003cb>③ 語彙カバー率\u003c/b>：帯の正答 × 帯の本文割合 ＝ リスト内の既知率。さらに、リスト外の語（過去年度を1年ずつ除いて検証すると本文の約${Math.round((1-Q_LIST)*100)}%）と、学習不要の語（冠詞・代名詞・固有名詞・数字など約${Math.round(EXCL*100)}%）を加味して本文全体の語彙カバー率にします。\u003c/p>\n  \u003cp>\u003cb>④ 語彙点\u003c/b>：語彙カバー率と読解の得点率の関係（95%前後で十分な理解、98%で良好という語彙研究の知見を参考にした折れ線の仮定）で換算し、満点×（${Math.round(FLOOR*100)}%＋${100-Math.round(FLOOR*100)}%×理解度）とします。出題語をすべて知っていれば語彙点は100%です。\u003c/p>\n  \u003cp>\u003cb>⑤ 速度係数\u003c/b>：帯ごとの平均反応時間（${CAP_MS/1000}秒で頭打ち・少数回答は全体平均に寄せる）を本文の出現割合で重みづけして「本文換算の反応時間」を求め、${TARGET}秒以下なら×1.0、遅ければ ${TARGET}÷反応時間 を掛けます。出題は難語寄りなので、単純な「100秒÷回答数」より実際の読解に近い値になります。\u003c/p>\n  \u003cp>\u003cb>⑥ 予想範囲\u003c/b>：回答を帯ごとに復元抽出して300回再計算（ブートストラップ）し、さらにリスト外語の割合・不要語の割合・リスト外語の既知率・換算の位置ズレを毎回ゆらして、点数の5〜95パーセンタイルを範囲にしています。\u003c/p>\n  \u003cp>\u003cb>⑦ 直近5回の合算\u003c/b>：直近5回までの回答を、新しい回ほど重く（1回さかのぼるごとに×${POOL_D}）1つにまとめて帯ごとの正答と反応時間を推定し直します。回答数が増えるぶん誤差が小さくなり、日による調子の波も均されます。上達の途中では古い回の影響が残るため、重みで新しい回を優先しています。\u003c/p>\n  \u003cp class=\"sub\">※単語力と反応速度だけから見た目安です。文法・構文把握・英作文・記述力・時間配分は含みません。回答数が少ないほど誤差が大きくなります。実際の点数を保証するものではありません。\u003c/p>\u003c/div>\u003c/details>\n  ${rvBtn()}\u003cbutton class=\"btn\" onclick=\"ptIntro()\">もう一度受ける\u003c/button>\u003cbutton class=\"btn alt\" onclick=\"records()\">記録・グラフを見る\u003c/button>\n  ${isNew?'':`\u003cbutton class=\"ghost\" onclick=\"delRec(${idx})\">この記録を削除\u003c/button>`}`;\n}\nlet RC={metric:'score',sel:null,arm:null};\nconst metrics=()=>{const mx=predMax();return{\n  score:{n:'予想点数',g:e=>Math.round(e.s.frac*mx),min:0,max:mx,ticks:[0,.25,.5,.75,1].map(x=>Math.round(x*mx)),f:v=>Math.round(v)+'点',lo:false},\n  pool:{n:'直近5回合算',g:(e,i)=>Math.round(analyzePool(i,0).frac*mx),min:0,max:mx,ticks:[0,.25,.5,.75,1].map(x=>Math.round(x*mx)),f:v=>Math.round(v)+'点',lo:false},\n  acc:{n:'正答率',g:e=>e.s.acc*100,min:0,max:100,ticks:[0,25,50,75,100],f:v=>v.toFixed(0)+'%',lo:false},\n  avg:{n:'平均回答秒',g:e=>e.s.avg,min:0,max:null,ticks:null,f:v=>v.toFixed(2)+'秒',lo:true},\n  rt:{n:'本文換算の反応秒',g:e=>e.s.rt,min:0,max:null,ticks:null,f:v=>v.toFixed(2)+'秒',lo:true},\n  cT:{n:'推定本文カバー率',g:e=>e.s.cT*100,min:60,max:100,ticks:[60,70,80,90,100],f:v=>v.toFixed(1)+'%',lo:false},\n  vocab:{n:'推定語彙数',g:e=>e.s.vocab,min:0,max:null,ticks:null,f:v=>Math.round(v)+'語',lo:false},\n  n:{n:'回答数',g:e=>e.s.n,min:0,max:null,ticks:null,f:v=>v+'問',lo:false}}};\nfunction chartSVG(vals,m,sel){\n  const Wd=600,Ht=240,Lm=48,Rm=14,Tp=14,Bt=30,pw=Wd-Lm-Rm,ph=Ht-Tp-Bt,n=vals.length,tm=m.n.includes('秒');\n  let mx=m.max,tk=m.ticks;\n  if(mx===null){const top=Math.max(...vals)*1.15||1,st=tm?0.5:(top>1000?1000:top>400?500:top>100?50:10);mx=Math.ceil(top/st)*st;tk=[];for(let v=0;v\u003c=mx+1e-9;v+=mx/4)tk.push(v)}\n  const X=i=>Lm+(n===1?pw/2:pw*i/(n-1)),Y=v=>Tp+ph*(1-(Math.min(mx,Math.max(m.min,v))-m.min)/(mx-m.min));\n  let s=`\u003csvg viewBox=\"0 0 ${Wd} ${Ht}\" style=\"width:100%;height:auto;display:block\">`;\n  tk.forEach(t=>s+=`\u003cline x1=\"${Lm}\" x2=\"${Wd-Rm}\" y1=\"${Y(t)}\" y2=\"${Y(t)}\" style=\"stroke:var(--line)\"/>\u003ctext x=\"${Lm-6}\" y=\"${Y(t)+4}\" text-anchor=\"end\" font-size=\"11\" style=\"fill:var(--mut)\">${tm?t.toFixed(1):Math.round(t)}\u003c/text>`);\n  if(m.n==='予想点数'||m.n==='直近5回合算')LV.slice(0,5).forEach(l=>s+=`\u003ctext x=\"${Wd-Rm-2}\" y=\"${Y(l[0]*mx)-3}\" text-anchor=\"end\" font-size=\"10\" style=\"fill:var(--mut)\">${l[1]}\u003c/text>`);\n  const step=Math.ceil(n/8);vals.forEach((v,i)=>{if(i%step===0||i===n-1)s+=`\u003ctext x=\"${X(i)}\" y=\"${Ht-10}\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:var(--mut)\">${i+1}\u003c/text>`});\n  s+=`\u003ctext x=\"${Lm}\" y=\"${Ht-1}\" font-size=\"10\" style=\"fill:var(--mut)\">受験回\u003c/text>`;\n  const ma=vals.map((_,i)=>{const a=vals.slice(Math.max(0,i-4),i+1);return a.reduce((x,y)=>x+y,0)/a.length});\n  if(n>1){s+=`\u003cpolyline points=\"${ma.map((v,i)=>X(i)+','+Y(v)).join(' ')}\" style=\"fill:none;stroke:var(--gold);stroke-width:2;stroke-dasharray:5 4\"/>\u003cpolyline points=\"${vals.map((v,i)=>X(i)+','+Y(v)).join(' ')}\" style=\"fill:none;stroke:var(--ac);stroke-width:2.2\"/>`}\n  const bi=vals.indexOf(m.lo?Math.min(...vals):Math.max(...vals));\n  vals.forEach((v,i)=>{s+=`\u003ccircle cx=\"${X(i)}\" cy=\"${Y(v)}\" r=\"${i===sel?7:4.5}\" style=\"fill:var(--ac);stroke:${i===bi?'var(--gold)':'var(--card)'};stroke-width:${i===bi?3:1.5}\" onclick=\"recSel(${i})\"/>`});\n  return s+'\u003c/svg>';\n}\nfunction records(){\n  Q=null;clearInterval(T);\n  const E=S.tests;if(!E.length){app.innerHTML=`\u003cbutton class=\"ghost\" onclick=\"home()\">← 戻る\u003c/button>\u003ch2>記録\u003c/h2>\u003cp class=\"sub\">まだ記録がありません。\u003c/p>\u003cbutton class=\"btn\" onclick=\"ptIntro()\">テストを受ける\u003c/button>`;return}\n  const MET=metrics(),mx=predMax(),m=MET[RC.metric],vals=E.map((e,i)=>m.g(e,i)),sel=RC.sel!==null&&RC.sel\u003cE.length?RC.sel:E.length-1,e=E[sel];\n  const best=m.lo?Math.min(...vals):Math.max(...vals),last5=vals.slice(-5),avg5=last5.reduce((a,b)=>a+b,0)/last5.length;\n  const tabs=Object.entries(MET).map(([k,v])=>`\u003cbutton class=\"card\" style=\"padding:6px 10px;${k===RC.metric?'border-color:var(--ac);color:var(--ac);font-weight:700':''}\" onclick=\"recMet('${k}')\">${v.n}\u003c/button>`).join('');\n  const sc=E.map(x=>Math.round(x.s.frac*mx)),tot=sc.length;\n  app.innerHTML=`\u003cbutton class=\"ghost\" onclick=\"home()\">← ホーム\u003c/button>\u003ch2>歴代の記録\u003c/h2>\n  \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:6px;margin:6px 0\">${tabs}\u003c/div>\n  \u003cdiv class=\"cov\" style=\"padding:8px\">${chartSVG(vals,m,sel)}\u003cp class=\"sub\" style=\"margin:2px 0\">実線＝各回の記録　金の点線＝直近5回の移動平均　金の縁＝${m.lo?'最速':'最高'}　点をタップで詳細\u003c/p>\u003c/div>\n  \u003cdiv class=\"cov\">\u003ctable class=\"wl\">\u003ctr>\u003ctd>受験回数\u003c/td>\u003ctd>${tot}回\u003c/td>\u003c/tr>\u003ctr>\u003ctd>${m.n} ${m.lo?'最速':'自己ベスト'}\u003c/td>\u003ctd>\u003cb>${m.f(best)}\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>${m.n} 直近5回平均\u003c/td>\u003ctd>${m.f(avg5)}\u003c/td>\u003c/tr>\u003ctr>\u003ctd>予想点数 全体平均\u003c/td>\u003ctd>${(sc.reduce((a,b)=>a+b,0)/tot).toFixed(1)}点（満点 ${mx}）\u003c/td>\u003c/tr>${tot>1?`\u003ctr>\u003ctd>初回→最新（${m.n}）\u003c/td>\u003ctd>${m.f(vals[0])} → \u003cb>${m.f(vals[tot-1])}\u003c/b>\u003c/td>\u003c/tr>`:''}\u003c/table>\u003c/div>\n  \u003cdiv class=\"cov\">\u003cdiv class=\"sub\">選択中：第${sel+1}回（${fmtD(e.t)}）\u003c/div>\u003cdiv class=\"covn\">${Math.round(e.s.frac*mx)}\u003csmall>点　正答率${pct(e.s.acc)}　平均${e.s.avg.toFixed(2)}秒/問　${e.s.n}問\u003c/small>\u003c/div>\u003cbutton class=\"btn alt\" onclick=\"showPT(${sel},false)\">この回の詳細結果・分析を見る\u003c/button>\u003c/div>\n  \u003cdetails>\u003csummary>全${tot}回の一覧\u003c/summary>\u003ctable class=\"wl\">\u003ctr>\u003ctd>回\u003c/td>\u003ctd>日時\u003c/td>\u003ctd>点\u003c/td>\u003ctd>正答\u003c/td>\u003ctd>秒/問\u003c/td>\u003c/tr>${E.map((x,i)=>`\u003ctr onclick=\"showPT(${i},false)\" style=\"cursor:pointer\">\u003ctd>${i+1}\u003c/td>\u003ctd>${fmtD(x.t)}\u003c/td>\u003ctd>\u003cb>${Math.round(x.s.frac*mx)}\u003c/b>\u003c/td>\u003ctd>${pct(x.s.acc)}\u003c/td>\u003ctd>${x.s.avg.toFixed(2)}\u003c/td>\u003c/tr>`).reverse().join('')}\u003c/table>\u003c/details>\n  \u003cbutton class=\"btn\" onclick=\"ptIntro()\">テストを受ける\u003c/button>`;\n}\nfunction recMet(k){RC.metric=k;records()}\nfunction recSel(i){RC.sel=i;records()}\nfunction delRec(i){if(RC.arm!==i){RC.arm=i;const b=app.querySelector('.ghost:last-child');if(b)b.textContent='もう一度押すと削除';setTimeout(()=>{RC.arm=null},4000);return}S.tests.splice(i,1);RC.arm=null;RC.sel=null;save();records()}\n\ndocument.addEventListener('keydown',e=>{\n  if(!Q)return;\n  if(Q.mode==='pt'){if(/^[1-6]$/.test(e.key))ptAns(+e.key-1);else if(e.key==='0'||e.key==='7')ptAns(-1);return}\n  if(/^[1-6]$/.test(e.key))ans(+e.key-1);\n  else if((e.key==='Enter'||e.key===' ')&&Q.mode==='learn'&&Q.answered&&document.querySelector('#fb .btn')){e.preventDefault();nextLearn()}\n});\n/* ===================== 利用規約（同意ゲート） ===================== */\nconst TOS_KEY='hokudai_vocab_tos_v1';\nfunction tosOK(){try{return localStorage.getItem(TOS_KEY)==='1'}catch(e){return false}}\nconst TOS_BODY=`\n\u003ch3>第1条（利用許諾）\u003c/h3>\n\u003cp>本アプリ「英単語マスター」（以下「本アプリ」）は、開発者が著作権その他の権利を保有する学習用ツールです。利用者は、本規約に同意し、かつ\u003cb>開発者から使用の許可を得たうえで\u003c/b>本アプリを使用するものとします。本規約への同意により、利用者本人に限り、非独占的・譲渡不能・取消可能な使用許諾が付与されます。\u003c/p>\n\u003ch3>第2条（禁止事項）\u003c/h3>\n\u003cp>利用者は、次の行為を行ってはなりません。\u003c/p>\n\u003col>\n\u003cli>開発者の事前の許可なく、本アプリの全部または一部を複製・改変・再配布・公開・販売・貸与・譲渡すること。\u003c/li>\n\u003cli>開発者の許可なく、本アプリのURL・ファイル・ソースコード・収録語句データを第三者へ共有し、またはSNS・動画投稿サイト・配布サイトその他の場に転載・投稿すること。\u003c/li>\n\u003cli>本アプリを有料で提供し、定額課金の対象とし、広告その他の手段によって商業利用すること。\u003c/li>\n\u003cli>著作権表示・クレジット表示を削除または改変すること。\u003c/li>\n\u003cli>逆コンパイル、リバースエンジニアリング、難読化の解除その他ソースコードを抽出・流用する行為。\u003c/li>\n\u003cli>本アプリの全部または一部を自己の製作物として公表する行為。\u003c/li>\n\u003cli>その他、開発者または第三者の権利を侵害し、または法令に違反する行為。\u003c/li>\n\u003c/ol>\n\u003ch3>第3条（許可の範囲）\u003c/h3>\n\u003cp>使用が許される範囲・期間・人数は、開発者が別途通知する条件に従います。許可は利用者本人に限られ、第三者へ引き継ぐことはできません。\u003c/p>\n\u003ch3>第4条（違反に対する措置）\u003c/h3>\n\u003cp>利用者が本規約に違反した場合、開発者は催告を要せず、直ちに次の措置を講じることができます。利用者はこれに異議を述べず、直ちに従うものとします。\u003c/p>\n\u003col>\n\u003cli>使用許諾の取消しおよび利用停止の要求。この場合、利用者は本アプリの使用および複製物の利用を直ちに中止し、保有する複製物をすべて削除しなければなりません。\u003c/li>\n\u003cli>配布物・投稿・アップロードの削除要求、およびプラットフォーム運営者に対する削除申請・著作権侵害の申立て。\u003c/li>\n\u003cli>利用者に帰属する本アプリ関連のデータ・アカウント・アクセス権の抹消（技術的手段による利用の拒否を含む）。\u003c/li>\n\u003cli>違反により開発者に生じた損害（調査費用、弁護士費用、プラットフォーム対応費用、逸失利益その他の費用を含む）の全額についての損害賠償請求。\u003c/li>\n\u003cli>法令に基づく差止請求、仮処分の申立て、損害賠償請求訴訟、刑事告訴その他の法的措置。\u003c/li>\n\u003cli>将来にわたる利用許可の拒否（再申請の不受理）。\u003c/li>\n\u003c/ol>\n\u003ch3>第5条（無保証・免責）\u003c/h3>\n\u003cp>本アプリは現状有姿で提供され、動作の完全性、正確性、特定目的への適合性、学習効果について、開発者は一切保証しません。収録語句および出現頻度・予想点数は独自の集計・推定に基づく参考値です。本アプリの利用または利用不能により生じた損害について、開発者は責任を負いません。\u003c/p>\n\u003ch3>第6条（学習データの取扱い）\u003c/h3>\n\u003cp>学習の進捗およびテスト記録は、利用者のブラウザ内（localStorage）にのみ保存され、開発者へ送信されません。ブラウザのデータ削除や端末の変更により失われる場合があります。\u003c/p>\n\u003ch3>第7条（本規約の変更）\u003c/h3>\n\u003cp>開発者は本規約をいつでも変更できます。変更後の規約は本アプリ上に表示した時点で効力を生じます。重要な変更を行う場合は、同意のバージョンを更新し、改めて同意を求めることがあります。\u003c/p>\n\u003ch3>第8条（準拠法・管轄）\u003c/h3>\n\u003cp>本規約は日本法に準拠します。本アプリに関して開発者と利用者との間に生じた紛争は、開発者の住所地を管轄する裁判所を第一審の専属的合意管轄裁判所とします。\u003c/p>`;\nfunction tosGate(){\n  if(tosOK()){home();return}\n  const old=document.getElementById('tos-root');if(old)old.remove();\n  const root=document.createElement('div');root.id='tos-root';\n  root.setAttribute('role','dialog');root.setAttribute('aria-modal','true');\n  root.innerHTML=`\u003cdiv class=\"tosbox\">\u003ch2>利用規約への同意\u003c/h2>\n  \u003cp class=\"sub\">本アプリ「英単語マスター」は、開発者が著作権を有するツールです。利用には、下記の利用規約への同意が必要です（開発者の許可を得て使用することを含みます）。\u003c/p>\n  \u003cdiv class=\"tosbody\">${TOS_BODY}\u003c/div>\n  \u003clabel class=\"toschk\">\u003cinput type=\"checkbox\" id=\"tos-cb\">\u003cspan>私は、開発者から本アプリの使用許可を得ており、上記の利用規約をすべて読み、各条項に同意します。\u003c/span>\u003c/label>\n  \u003cdiv class=\"tosbtns\">\u003cbutton class=\"tosbtn\" id=\"tos-ok\" disabled>同意して利用を開始\u003c/button>\u003cbutton class=\"tosbtn ghost\" id=\"tos-no\">同意しない\u003c/button>\u003c/div>\u003c/div>`;\n  document.body.appendChild(root);\n  document.body.style.overflow='hidden';\n  const cb=root.querySelector('#tos-cb'),ok=root.querySelector('#tos-ok');\n  cb.addEventListener('change',()=>{ok.disabled=!cb.checked});\n  ok.addEventListener('click',()=>{\n    if(!cb.checked)return;\n    try{localStorage.setItem(TOS_KEY,'1')}catch(e){}\n    document.body.style.overflow='';\n    root.remove();\n    home();\n  });\n  root.querySelector('#tos-no').addEventListener('click',tosDeny);\n}\nfunction tosDeny(){\n  const root=document.getElementById('tos-root');if(!root)return;\n  document.body.style.overflow='hidden';\n  root.innerHTML=`\u003cdiv class=\"tosbox\">\u003ch2>利用をお断りしました\u003c/h2>\n  \u003cdiv class=\"tosbody\">\u003cdiv class=\"tosdeny\">\u003cp>\u003cb>同意が確認できないため、本アプリを利用することはできません。\u003c/b>\u003c/p>\n  \u003cp>本アプリは開発者が著作権を保有し、開発者の許可を得た利用者のみが使用できるツールです。同意しない限り、ステージ学習・昇格試験・予想点数テストを含むすべての機能は利用できません。\u003c/p>\u003c/div>\u003c/div>\n  \u003cdiv class=\"tosbtns\">\u003cbutton class=\"tosbtn\" id=\"tos-back\">利用規約を読み直す\u003c/button>\u003c/div>\u003c/div>`;\n  root.querySelector('#tos-back').addEventListener('click',()=>{root.remove();tosGate()});\n}\n\n/* ===================== 追加機能：単語の自動発音 / 診断テストの復習 ===================== */\nconst RV_NEED=2;\n/* 復習リスト S.rv：{単語番号:連続正解数}。診断テストで間違い・わからなかった語が入る。既存の受験記録からも復元 */\nif(!S.rv||typeof S.rv!=='object'||Array.isArray(S.rv)){S.rv={};if(S.tests.length)rvAdd(S.tests[S.tests.length-1]);save()}\nfunction rvAdd(e){(e.resp||[]).forEach(r=>{if(r[1]!==1&&W[r[0]])S.rv[r[0]]=0})}\nconst rvIds=()=>Object.keys(S.rv).map(Number).filter(i=>W[i]);\nfunction primeSpeech(){try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}\n\n/* --- 自動発音：学習・昇格試験・復習（ホームでON/OFF） --- */\nfunction spkBar(){\n  const on=!!S.autoSpeak;\n  return `\u003cdiv class=\"pcbar\">\u003cdiv class=\"pcrow\">\u003cdiv>\u003cb>単語の自動発音\u003c/b>\u003cdiv class=\"sub\" style=\"margin:0\">問題が出るたびに英単語の音声を自動で再生します（学習・昇格試験・復習）\u003c/div>\u003c/div>\u003cbutton class=\"pctog ${on?'':'off'}\" onclick=\"toggleSpeak()\">${on?'ON':'OFF'}\u003c/button>\u003c/div>\u003c/div>`;\n}\nfunction toggleSpeak(){S.autoSpeak=!S.autoSpeak;save();if(S.autoSpeak)primeSpeech();home()}\nconst _qv0=qview;qview=function(){_qv0();if(S.autoSpeak&&Q&&Q.cur!==undefined)speak(W[Q.cur][0])};\n\n/* --- 自動発音：診断テスト（テスト開始前の画面でON/OFFを選ぶ） --- */\nfunction ptSpkBar(){\n  const on=!!S.ptSpeak;\n  return `\u003cdiv class=\"pcbar\">\u003cdiv class=\"pcrow\">\u003cdiv>\u003cb>単語の自動発音\u003c/b>\u003cdiv class=\"sub\" style=\"margin:0\">問題が出るたびに音声を自動再生します。再生中も制限時間は進みます\u003c/div>\u003c/div>\u003cbutton class=\"pctog ${on?'':'off'}\" onclick=\"togglePtSpeak()\">${on?'ON':'OFF'}\u003c/button>\u003c/div>\u003c/div>`;\n}\nfunction togglePtSpeak(){S.ptSpeak=!S.ptSpeak;save();if(S.ptSpeak)primeSpeech();ptIntro()}\nconst _pv0=ptView;ptVie >\u003c/tr>`;\n  app.innerHTML=`\u003cbutton class=\"ghost\" onclick=\"home()\">← ステージ一覧\u003c/button>\u003ch2>Stage ${st+1}　\u003cspan class=\"sub\">${a+1}〜${b}位\u003c/span>\u003c/h2>\n  ${msg?`\u003cp class=\"good\">${msg}\u003c/p>`:''}\n  \u003cdiv class=\"bar\">\u003ci style=\"width:${rate(st)}%\">\u003c/i>\u003c/div>\u003cp class=\"sub\">修得率 ${rate(st).toFixed(1)}% ・ 修得 ${m} / ${n}語（${NEED}回連続正解で修得 ・ 間違えると連続回数は0に戻ります）\u003c/p>\n  \u003cp class=\"sub\">共通テスト単語カバー率 \u003cb>${cov().toFixed(1)}%\u003c/b>${S.clear[st]?'（このステージは昇格試験クリアにより100%として計上。修得ポイントは増えません）':''}\u003c/p>\n  \u003cbutton class=\"btn\" ${full?'disabled':''} onclick=\"startLearn(${st})\">${m?'学習をつづける':'学習スタート'}\u003c/button>\n  \u003cbutton class=\"btn alt\" onclick=\"startExam(${st})\">昇格試験（${EXT}秒で${EXQ}問正解）${S.clear[st]?' ✔クリア済み':''}\u003c/button>\n  ${full&&!S.clear[st]?`\u003cbutton class=\"btn alt\" onclick=\"skipExam(${st})\">✔ 100語修得済み：昇格試験をスキップ${st+1\u003cNST?'して次へ':''}\u003c/button>`:''}\n  \u003cdetails>\u003csummary>単語リスト\u003c/summary>\u003ctable class=\"wl\">${rows}\u003c/table>\u003c/details>`;\n}\nfunction startLearn(st){Q={mode:'learn',st,last:-1};nextLearn()}\nfunction nextLearn(){\n  const[a,b]=range(Q.st),rem=[];\n  for(let i=a;i\u003cb;i++)if(!S.mast[i])rem.push(i);\n  if(!rem.length)return stage(Q.st,'🎉 全語を修得しました！昇格試験に挑戦するか、スキップして次へ進めます。');\n  const cand=rem.length>1?rem.filter(i=>i!==Q.last):rem;const mn=Math.min(...cand.map(i=>S.streak[i]||0));const pool=cand.filter(i=>(S.streak[i]||0)===mn);\n  Q.cur=pool[Math.floor(Math.random()*pool.length)];Q.last=Q.cur;Q.ch=choices(Q.cur);Q.answered=false;qview();\n}\nfunction qview(){\n  const i=Q.cur,w=W[i],ex=Q.mode==='exam',[a,b]=range(Q.st);\n  const head=ex?`\u003cdiv class=\"top\">\u003cbutton class=\"ghost\" onclick=\"quitExam()\">× 中止\u003c/button>\u003cspan>正解 ${Q.ok} / ${EXQ}　（${Q.idx+1}問目）\u003c/span>\u003cspan class=\"tm\" id=\"tm\">${EXT}.0\u003c/span>\u003c/div>\u003cdiv class=\"bar\">\u003ci id=\"tb\" style=\"width:100%\"
